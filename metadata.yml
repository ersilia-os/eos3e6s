Identifier: eos3e6s
Slug: chembl-decoys
Status: Ready
Title: ChEMBL decoy sampler
Description: Assembles 100 decoy molecules for a query compound, selecting from ChEMBL35
  structures that match it on molecular weight, lipophilicity, hydrogen bond counts
  and rotatable bonds while remaining structurally dissimilar below a Tanimoto threshold
  of 0.25. Decoys constructed this way give a negative set that cannot be separated
  from actives by gross physical properties alone, which is what makes benchmark comparisons
  meaningful. Selection is randomised, so repeated runs return different sets.
