Identifier: eos3e6s
Slug: chembl-decoys
Status: In maintenance
Title: ChEMBL decoy sampler
Description: This model samples decoy molecules from ChEMBL35 to build negative 
  datasets. We look for molecules with low tanimoto similarity (<= 0.25) but 
  similar physicochemical characteristics (MW, LogP, HDB, HAB, RB). For each 
  input molecule, the model will return 100 decoys. The design has been informed
  by other methods such as DUD-E and LUDe.
